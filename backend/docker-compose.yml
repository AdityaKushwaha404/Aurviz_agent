services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: aurviz
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-only}
      POSTGRES_DB: aurviz
    ports:
      - "5432:5432"
    volumes:
      - aurviz-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aurviz -d aurviz"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  aurviz-postgres:
