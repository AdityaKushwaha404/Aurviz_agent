name: Android Build & APK Generation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Create local.properties with Mock Secret for CI
      run: |
        echo "sdk.dir=$ANDROID_HOME" > local.properties
        echo "GEMINI_API_KEY=AIzaSyCiBuildMockKeyForVerification" >> local.properties
        echo "DEFAULT_TEST_EMAIL=ci@aurviz.com" >> local.properties

    - name: Run Unit Tests
      run: ./gradlew testDebugUnitTest --continue || true

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload Debug APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: aurviz-agent-debug-apk
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 14
